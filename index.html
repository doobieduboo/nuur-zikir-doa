    settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.2-1.8 3.1-1.8-.6a8 8 0 0 1-2.1 1.2l-.4 1.9h-3.6l-.4-1.9a8 8 0 0 1-2.1-1.2l-1.8.6-1.8-3.1 1.4-1.2a8 8 0 0 1 0-2.4l-1.4-1.2 1.8-3.1 1.8.6a8 8 0 0 1 2.1-1.2l.4-1.9h3.6l.4 1.9a8 8 0 0 1 2.1 1.2l1.8-.6 1.8 3.1-1.4 1.2a8 8 0 0 1 0 2.4Z" transform="translate(0 -2) scale(.97)"/>',
    right:'<path d="m9 18 6-6-6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 4 4 10-10"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
    rotate:'<path d="M3 11a9 9 0 1 1 2.8 7"/><path d="M3 4v7h7"/>',minus:'<path d="M5 12h14"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20.5 14a8.5 8.5 0 0 1-10.6-10.5A8.5 8.5 0 1 0 20.5 14Z"/>',
    spark:'<path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',
    close:'<path d="m5 5 14 14M19 5 5 19"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',
    clipboard:'<path d="M8 4h8l1 2h3v15H4V6h3z"/><path d="M9 3h6v5H9z"/>',heart:'<path d="M20.8 5.6a5.5 5.5 0 0 0-7.7 0L12 6.7l-1.1-1.1a5.5 5.5 0 0 0-7.7 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>'
  };
  const svg = (name,size=18) => `<svg class="icon" style="width:${size}px;height:${size}px" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.spark}</svg>`;
  const defaults = {theme:'light',font:'normal',showLatin:true,showArabic:true,haptic:true};
  let data;
  try {data = JSON.parse(localStorage.getItem(STORE) || '{}')} catch {data={}};
  if (!data || typeof data !== 'object') data={};
  data.prefs = {...defaults,...(data.prefs||{})};
  if (!data.days || typeof data.days !== 'object') data.days={};
  let tab='home', prayer='Subuh', stepIdx=0, memorize=false, segmentIdx=0, installEvent=null, toastTimer=null;
  const app=document.getElementById('app');
  const dateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const day=()=>{
    let key=dateKey();if(!data.days[key])data.days[key]={done:{},counts:{}};
    const keys=Object.keys(data.days).sort();if(keys.length>45)keys.slice(0,keys.length-45).forEach(k=>delete data.days[k]);
    return data.days[key];
  };
  const counts=(p)=>{const d=day();if(!Array.isArray(d.counts[p]) || d.counts[p].length!==zikr.length)d.counts[p]=zikr.map(()=>0);return d.counts[p]};
  const isDone=(p)=>!!day().done[p] || counts(p).every((n,i)=>n>=zikr[i].target);
  const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch{}};
  const titleFor=(t)=>({home:'Beranda',zikr:'Panduan Zikir',dua:'Doa Permohonan',settings:'Pengaturan'})[t];
  const subtitleFor=(t)=>({home:'Temani setiap salat dengan zikir dan doa.',zikr:'Hitung bacaanmu, satu demi satu dengan tenang.',dua:'Doa pribadi untuk kebaikan dunia dan akhirat.',settings:'Sesuaikan pengalaman membaca dan berzikir.'})[t];
  const displayDate=()=>new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
  const goodGreeting=()=>{const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<19?'Selamat sore':'Selamat malam'};
  function applyPrefs(){document.body.classList.toggle('dark',data.prefs.theme==='dark');const size=data.prefs.font==='small'?'.91rem':data.prefs.font==='large'?'1.14rem':'1rem';const arab=data.prefs.font==='small'?'1.7rem':data.prefs.font==='large'?'2.25rem':'2rem';document.documentElement.style.setProperty('--reader',size);document.documentElement.style.setProperty('--arabic',arab)}
  const header=()=>`<header class="topbar"><div class="toprow"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">nuur<span style="color:#dcc184">.</span></div><div class="brand-sub">Zikir & doa harian</div></div></div><div class="top-actions"><button class="icon-button" data-action="theme" aria-label="Ganti tema">${svg(data.prefs.theme==='dark'?'sun':'moon',17)}</button></div></div><h1 class="top-title">${tab==='home'?'Tenang dalam zikir.':titleFor(tab)}</h1><p class="top-caption">${subtitleFor(tab)}</p></header>`;
  const navbar=()=>`<nav class="nav" aria-label="Navigasi utama">${[['home','Beranda','home'],['zikr','Zikir','zikr'],['dua','Doa','book'],['settings','Pengaturan','settings']].map(([id,title,ico])=>`<button data-nav="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}>${svg(ico,21)}<span>${title}</span></button>`).join('')}</nav>`;
  const completion=()=>prayers.filter(isDone).length;
  const home=()=>{
    const done=completion();
    return `<div class="content">
      <div class="eyebrow">${displayDate()}</div>
      <div class="hero-card spaced"><div class="hero-overline">${goodGreeting()}</div><div class="hero-main">Dekatkan hati kepada Allah.</div><div class="hero-foot">Satu zikir, satu doa, satu langkah menuju istiqamah.</div><button class="pill-button" data-nav="zikr">Mulai zikir ${svg('right',15)}</button></div>
      <div class="section-header"><h2 class="section-title">Amalan 5 waktu</h2><span class="minor">${done} dari 5 selesai</span></div>
      <div class="daily-grid">${prayers.map(p=>`<button class="prayer-check ${isDone(p)?'done':''}" data-prayerdone="${p}" aria-label="Tandai ${p} ${isDone(p)?'belum selesai':'selesai'}" aria-pressed="${isDone(p)}"><span class="check-mark">${svg('check',14)}</span><span>${p}</span></button>`).join('')}</div>
      <div class="meter-meta"><span>Progres hari ini</span><strong>${Math.round(done/5*100)}%</strong></div><div class="progress-line"><div class="progress-fill" style="width:${done/5*100}%"></div></div>
      <div class="section-header"><h2 class="section-title">Amalan pilihan</h2><span class="eyebrow">Setiap hari</span></div>
      <div class="list-tiles"><button class="tile" data-nav="zikr"><span class="tile-icon">${svg('zikr',23)}</span><span class="tile-main"><span class="tile-title">Zikir setelah salat</span><div class="tile-sub">Istigfar, tasbih, tahmid, takbir, dan tauhid</div></span><span class="arrow">${svg('right',17)}</span></button>
      <button class="tile" data-nav="dua"><span class="tile-icon">${svg('book',23)}</span><span class="tile-main"><span class="tile-title">Doa dunia dan akhirat</span><div class="tile-sub">Rezeki, jodoh, orang tua, ilmu, ampunan & akhirat</div></span><span class="arrow">${svg('right',17)}</span></button></div>
      <div class="mini-verse spaced"><div class="eyebrow">Pengingat hati</div><div class="arabic">فَاذْكُرُونِي أَذْكُرْكُمْ</div><div class="minor">“Ingatlah kepada-Ku, Aku pun akan ingat kepadamu.”</div><div class="tiny" style="margin-top:7px">QS. Al-Baqarah: 152 (penggalan ayat)</div></div>
      <div class="foot-note">Ketuk nama salat untuk menandai amalan selesai secara manual. Penghitung zikir dan progres disimpan hanya di perangkatmu.</div>
    </div>`;
  };
  const zikrPage=()=>{
    const z=zikr[stepIdx], cc=counts(prayer), c=cc[stepIdx], pct=Math.min(100,c/z.target*100), alldone=isDone(prayer), finished=cc.every((n,i)=>n>=zikr[i].target);
    return `<div class="content"><div class="select-row"><div><div class="eyebrow">Sesi zikir</div><div class="minor">Pilih salat yang baru selesai</div></div><select id="prayer-select" aria-label="Pilih salat">${prayers.map(p=>`<option ${prayer===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="counter-panel"><div class="step-overline">Tahap ${stepIdx+1} dari ${zikr.length} · ${prayer}</div><h2 class="counter-title">${z.name}</h2>
      ${data.prefs.showArabic && z.arab ? `<div class="arabic counter-arabic" lang="ar">${z.arab}</div>`:''}
      ${data.prefs.showLatin ? `<p class="counter-latin">${z.latin.replace(/\\n/g, '<br>')}</p>`:''}<p class="counter-meaning">${z.meaning}</p>
      <div class="ring" style="--pct:${pct}%"><div class="ring-inner"><button class="tap-counter" data-action="increment" aria-label="Tambah satu bacaan ${z.name}" ${c>=z.target?'disabled':''}><span class="counter-value">${c}</span><span class="counter-target">dari ${z.target} kali</span><span class="tap-label">${c>=z.target?'Selesai ✓':'Ketuk untuk hitung'}</span></button></div></div>
      <div class="control-row"><button class="ghost-btn" data-action="decrement" ${c===0?'disabled':''}>${svg('minus',16)} Kurangi</button><button class="ghost-btn" data-action="resetstep">${svg('rotate',16)} Ulang tahap</button></div>
      </div>
      <div class="steps-strip" aria-label="Navigasi tahapan">${zikr.map((zz,i)=>`<button class="step-chip ${i===stepIdx?'current':cc[i]>=zz.target?'finished':''}" data-step="${i}" aria-label="Tahap ${i+1}, ${zz.name}">${cc[i]>=zz.target?'✓':i+1}</button>`).join('')}</div>
      <div class="pagination-row"><button class="ghost-btn" data-action="prevstep" ${stepIdx===0?'disabled':''}>${svg('left',15)} Sebelumnya</button><button class="ghost-btn" data-action="nextstep">${stepIdx===zikr.length-1?'Ke doa':'Berikutnya'} ${svg('right',15)}</button></div>
      ${finished||alldone?`<div class="success">${svg('check',17)} Alhamdulillah, sesi ${prayer} hari ini telah selesai. Lanjutkan dengan doa permohonan dengan tenang.</div>`:''}
      <div class="foot-note"><b>Catatan:</b> Istigfar dan doa setelah salam: HR. Muslim 591. Zikir 33–33–33 dan kalimat tauhid: HR. Muslim 597. Bacaan pujian dan selawat di akhir adalah pembuka doa pribadi, tidak memiliki jumlah khusus. Terdapat beberapa variasi zikir sahih lainnya.</div>
    </div>`;
  };
  const readingSection=(s,i)=>`<article class="prayer-section"><header><span>${String(i+1).padStart(2,'0')} / ${s.title}</span><button class="link-btn" data-copy="${i}">${svg('copy',14)} Salin</button></header><div class="prayer-text">${s.text}</div></article>`;
  const duaPage=()=>`<div class="content"><div class="reader-intro"><div class="arabic">﷽</div><p>Ya Allah, kepada-Mu aku memohon.</p><span>Doa pribadi · Baca sesuai kemampuan, tidak perlu menghafal kata demi kata.</span></div>
    <div class="reader-tools"><button class="soft-btn ${!memorize?'active':''}" data-action="readmode">${svg('book',15)} Baca semua</button><button class="soft-btn ${memorize?'active':''}" data-action="memorymode">${svg('spark',15)} Mode hafalan</button><button class="soft-btn" data-action="copyall">${svg('copy',15)} Salin</button></div>
    ${memorize?`<div class="meter-meta"><span>Bagian ${segmentIdx+1} dari ${dua.length}</span><span>${Math.round((segmentIdx+1)/dua.length*100)}%</span></div><div class="progress-line"><div class="progress-fill" style="width:${(segmentIdx+1)/dua.length*100}%"></div></div>${readingSection(dua[segmentIdx],segmentIdx)}<div class="pagination-row"><button class="ghost-btn" data-action="prevmemo" ${segmentIdx===0?'disabled':''}>${svg('left',15)} Sebelumnya</button><button class="pill-button" data-action="nextmemo">${segmentIdx===dua.length-1?'Ulangi hafalan':'Bagian berikutnya'} ${svg('right',15)}</button></div>`:dua.map(readingSection).join('')}
    <div class="mini-verse spaced"><div class="eyebrow">Doa sapu jagat</div><div class="arabic" lang="ar" style="font-size:24px">رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ</div>${data.prefs.showLatin?`<div class="minor" style="margin:4px 0 9px">Rabbanaa aatinaa fid-dunyaa hasanah, wa fil-aakhirati hasanah, wa qinaa 'adzaaban-naar.</div>`:''}<div class="tiny">QS. Al-Baqarah: 201</div><button class="soft-btn" style="margin-top:12px" data-action="copyshort">${svg('copy',14)} Salin doa sapu jagat</button></div>
    <div class="foot-note">Doa di atas adalah permohonan pribadi berbahasa Indonesia yang disusun untuk memudahkan hafalan, bukan teks hadis. Bacalah dengan ikhlas dan sertai ikhtiar serta amal baik.</div>
  </div>`;
  const toggleSetting=(name,title,copy)=>`<div class="setting-row"><div><div class="setting-title">${title}</div><div class="setting-copy">${copy}</div></div><button class="toggle ${data.prefs[name]?'on':''}" data-toggle="${name}" role="switch" aria-label="${title}" aria-checked="${data.prefs[name]}"></button></div>`;
  const settingPage=()=>`<div class="content"><div class="section-header" style="margin-top:0"><h2 class="section-title">Tampilan</h2></div><div class="settings-section">${toggleSetting('showArabic','Teks Arab','Tampilkan bacaan Arab pada zikir.')}${toggleSetting('showLatin','Teks Latin','Tampilkan bantuan bacaan transliterasi.')}${toggleSetting('haptic','Getaran ringan','Getar saat menghitung jika perangkat mendukung.')}</div>
    <div class="settings-section"><div class="setting-title">Ukuran huruf doa</div><p class="setting-copy">Pilih ukuran yang paling nyaman dibaca.</p><div class="font-options">${[['small','Kecil'],['normal','Sedang'],['large','Besar']].map(([v,l])=>`<button class="soft-btn ${data.prefs.font===v?'chosen':''}" data-font="${v}">${l}</button>`).join('')}</div></div>
    <div class="settings-section"><div class="setting-title">Tema</div><p class="setting-copy">Pilih mode terang atau gelap.</p><div class="font-options"><button class="soft-btn ${data.prefs.theme==='light'?'chosen':''}" data-settheme="light">${svg('sun',16)} Terang</button><button class="soft-btn ${data.prefs.theme==='dark'?'chosen':''}" data-settheme="dark">${svg('moon',16)} Gelap</button></div></div>
    <div class="section-header"><h2 class="section-title">Pasang ke Android</h2></div><div class="install-info"><strong>Aplikasi siap digunakan offline.</strong><br>Jika dibuka dari situs HTTPS di Chrome Android, buka menu ⋮ lalu pilih <b>Tambahkan ke layar utama</b> atau <b>Instal aplikasi</b>.<br><br>Jika hanya membuka file HTML di penyimpanan, fitur instalasi PWA tidak tersedia. Unggah berkas ke hosting HTTPS untuk memasangnya seperti aplikasi.
      <button class="pill-button install-action" id="install-button" data-action="install">${svg('download',16)} Instal Nuur</button></div>
    <div class="section-header"><h2 class="section-title">Data pribadi</h2></div><div class="settings-section"><div class="setting-title">Progres tersimpan lokal</div><div class="setting-copy">Semua hitungan disimpan di browser perangkat ini, tanpa akun atau pelacakan. Menghapus data situs dapat menghapus progres.</div><button class="ghost-btn" style="margin-top:14px" data-action="resetday">${svg('rotate',15)} Reset progres hari ini</button></div>
    <div class="foot-note">Nuur adalah panduan pribadi, bukan penentu waktu salat. Pengingat lima waktu ditandai manual. Bacaannya mengikuti rangkaian yang ada di panduan sebelumnya.</div>
  </div>`;
  function render(){applyPrefs();app.innerHTML=`<div class="shell">${header()}${({home,zikr:zikrPage,dua:duaPage,settings:settingPage})[tab]()}${navbar()}</div>`;save()}
  function goto(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
  function buzz(){if(data.prefs.haptic&&navigator.vibrate)navigator.vibrate(12)}
  function notify(message){const old=document.querySelector('.toast');if(old)old.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2200)}
  async function copy(value){try{if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(value)}else{const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.top='-1000px';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw new Error('Tidak didukung');el.remove()}notify('Teks berhasil disalin')}catch{notify('Tidak dapat menyalin pada browser ini')}}
  function inc(){const c=counts(prayer);if(c[stepIdx]>=zikr[stepIdx].target)return;c[stepIdx]++;buzz();if(c.every((n,i)=>n>=zikr[i].target)){day().done[prayer]=true;notify('Alhamdulillah, zikir selesai')}else if(c[stepIdx]===zikr[stepIdx].target && stepIdx<zikr.length-1){stepIdx++}render()}
  function resetDay(){if(!confirm('Hapus seluruh hitungan zikir dan tanda selesai untuk hari ini?'))return;data.days[dateKey()]={done:{},counts:{}};stepIdx=0;render();notify('Progres hari ini direset')}
  document.addEventListener('click',async e=>{
    const node=e.target.closest('[data-nav],[data-action],[data-toggle],[data-font],[data-settheme],[data-copy],[data-prayerdone],[data-step]');if(!node)return;
    if(node.dataset.nav){goto(node.dataset.nav);return}
    if(node.dataset.prayerdone){const p=node.dataset.prayerdone;day().done[p]=!isDone(p);if(!day().done[p])day().counts[p]=zikr.map(()=>0);render();return}
    if(node.dataset.step!==undefined){stepIdx=Number(node.dataset.step);render();return}
    if(node.dataset.toggle){data.prefs[node.dataset.toggle]=!data.prefs[node.dataset.toggle];render();return}
    if(node.dataset.font){data.prefs.font=node.dataset.font;render();return}
    if(node.dataset.settheme){data.prefs.theme=node.dataset.settheme;render();return}
    if(node.dataset.copy!==undefined){copy(dua[Number(node.dataset.copy)].text);return}
    switch(node.dataset.action){
      case 'theme':data.prefs.theme=data.prefs.theme==='light'?'dark':'light';render();break;
      case 'increment':inc();break;
      case 'decrement':{let c=counts(prayer);c[stepIdx]=Math.max(0,c[stepIdx]-1);day().done[prayer]=false;render();break}
      case 'resetstep':{let c=counts(prayer);c[stepIdx]=0;day().done[prayer]=false;render();break}
      case 'prevstep':stepIdx=Math.max(0,stepIdx-1);render();break;
      case 'nextstep':if(stepIdx>=zikr.length-1)goto('dua');else {stepIdx++;render()}break;
      case 'readmode':memorize=false;render();break;
      case 'memorymode':memorize=true;render();break;
      case 'prevmemo':segmentIdx=Math.max(0,segmentIdx-1);render();break;
      case 'nextmemo':segmentIdx=(segmentIdx+1)%dua.length;render();break;
      case 'copyall':copy(dua.map(s=>s.text).join('\n\n'));break;
      case 'copyshort':copy('رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ\nRabbanaa aatinaa fid-dunyaa hasanah, wa fil-aakhirati hasanah, wa qinaa \'adzaaban-naar.');break;
      case 'resetday':resetDay();break;
      case 'install':if(installEvent){installEvent.prompt();const result=await installEvent.userChoice;if(result.outcome==='accepted')notify('Instalasi dimulai');installEvent=null}else notify('Buka menu ⋮ browser lalu pilih Instal aplikasi');break;
    }
  });
  document.addEventListener('change',e=>{if(e.target.id==='prayer-select'){prayer=e.target.value;const c=counts(prayer);stepIdx=Math.max(0,c.findIndex((n,i)=>n<zikr[i].target));render()}});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});
  window.addEventListener('appinstalled',()=>{installEvent=null;notify('Nuur sudah terpasang')});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){day();render()}});
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
  render();
})();

</script>
</body>
</html>
